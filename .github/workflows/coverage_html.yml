name: Coverage HTML Report

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'

permissions:
  actions: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Generate coverage HTML

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python ${{ inputs.python_version || '3.12' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.12' }}

      - name: Install dependencies
        uses: ./.github/actions/linux_install

      - name: Install Pyccel with tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Coverage install
        uses: ./.github/actions/coverage_install

      - name: Fortran/C tests
        uses: ./.github/actions/pytest_run

      - name: Python tests
        uses: ./.github/actions/pytest_run_python

      - name: Parallel tests
        uses: ./.github/actions/pytest_parallel

      - name: Collect coverage
        continue-on-error: true
        uses: ./.github/actions/coverage_collection

      - name: Generate HTML report
        run: |
          echo -e "[paths]\nsource =\n   $(pwd)/pyccel\n   */site-packages/pyccel\n[html]\ndirectory = htmlcov" > .coveragerc
          coverage html || true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 1
