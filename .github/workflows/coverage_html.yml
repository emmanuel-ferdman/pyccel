name: Coverage HTML Report

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'
      test_filter:
        description: 'pytest -k filter (empty = all Fortran tests)'
        required: false
        type: string
        default: ''

permissions:
  actions: read

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Generate coverage HTML

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage
          python -m pip install .[test]

      - name: Setup coverage auto-start
        run: |
          INSTALL_DIR=$(python -c "import pyccel; print(pyccel.__path__[0])")
          SITE_DIR=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "import coverage; coverage.process_startup()" > ${SITE_DIR}/pyccel_cov.pth
          cat > .coveragerc <<EOF
          [run]
          parallel = True
          source = ${INSTALL_DIR}
          data_file = $(pwd)/.coverage
          omit = */pyccel/extensions/*
          [report]
          include = ${INSTALL_DIR}/*
          [html]
          directory = htmlcov
          EOF
          echo "SITE_DIR=${SITE_DIR}" >> $GITHUB_ENV
          echo "COVERAGE_PROCESS_START=$(pwd)/.coveragerc" >> $GITHUB_ENV

      - name: Run Fortran tests
        run: |
          FILTER="${{ inputs.test_filter }}"
          if [ -n "$FILTER" ]; then
            python -m pytest tests/codegen/fcode/ tests/epyccel/ tests/errors/ \
              -m fortran --tb=line -q -k "$FILTER" || true
          else
            python -m pytest tests/codegen/fcode/ tests/epyccel/ tests/errors/ \
              -m fortran --tb=line -q || true
          fi

      - name: Collect coverage
        run: |
          rm ${SITE_DIR}/pyccel_cov.pth
          coverage combine || true
          coverage report --show-missing || true
          coverage html || true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 1
